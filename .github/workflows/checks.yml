name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -B -m unittest discover -s tests/unit -v
      - run: python -B -m unittest discover -s tests/server -v
      - run: python -B scripts/package_plugin.py
      - run: python -B -m unittest discover -s tests/release -v
